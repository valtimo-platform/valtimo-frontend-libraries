<div class="general-tab">
  <div class="link-upload-process">
    <p class="link-upload-process__title">
      {{ 'dossierManagement.tabs.generalTab.linkUploadProcess.title' | translate }}
    </p>
    <cds-dropdown
      [label]="'dossierManagement.tabs.generalTab.linkUploadProcess.label' | translate"
      [dropUp]="false"
      [placeholder]="'dossierManagement.tabs.generalTab.linkUploadProcess.placeholder' | translate"
    >
      <cds-dropdown-list [items]="processes"></cds-dropdown-list>
    </cds-dropdown>
  </div>

  <div class="case-handler-process">
    <p class="case-handler-process__title">
      {{ 'dossierManagement.tabs.generalTab.caseHandler.title' | translate }}
    </p>

    <cds-toggle
      [label]="'dossierManagement.tabs.generalTab.caseHandler.canHaveHandler' | translate"
      [onText]="'Yes'"
      [offText]="'No'"
    ></cds-toggle>

    <cds-toggle
      [label]="'dossierManagement.tabs.generalTab.caseHandler.assignUser' | translate"
      [onText]="'Yes'"
      [offText]="'No'"
      [disabled]="true"
    ></cds-toggle>
  </div>
</div>
