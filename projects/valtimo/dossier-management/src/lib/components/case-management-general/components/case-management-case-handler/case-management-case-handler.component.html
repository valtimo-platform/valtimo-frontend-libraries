<ng-container
  *ngIf="{
    currentValue: currentValue$ | async,
    documentDefinitionName: documentDefinitionName$ | async,
    loading: loading$ | async,
    disabled: disabled$ | async,
  } as obs"
>
  <div class="case-handler-process">
    <p class="case-handler-process__title">
      {{ 'dossierManagement.tabs.generalTab.caseHandler.title' | translate }}
    </p>

    <div class="case-handler-process__toggles">
      <cds-toggle
        [label]="'dossierManagement.tabs.generalTab.caseHandler.canHaveHandler' | translate"
        [onText]="'Yes'"
        [offText]="'No'"
        (click)="toggleAssignee(obs?.currentValue, obs.documentDefinitionName)"
      ></cds-toggle>

      <!--      <cds-toggle-->
      <!--        [label]="'dossierManagement.tabs.generalTab.caseHandler.assignUser' | translate"-->
      <!--        [onText]="'Yes'"-->
      <!--        [offText]="'No'"-->
      <!--        [disabled]="obs.disabled"-->
      <!--        (click)="toggleTaskAssignment(obs?.currentValue, obs?.documentDefinitionName)"-->
      <!--      ></cds-toggle>-->
      <cds-toggle
        [label]="'dossierManagement.tabs.generalTab.caseHandler.assignUser' | translate"
        [onText]="'Yes'"
        [offText]="'No'"
        [disabled]="true"
        (click)="toggleTaskAssignment(obs?.currentValue, obs?.documentDefinitionName)"
      ></cds-toggle>
    </div>
  </div>
</ng-container>
