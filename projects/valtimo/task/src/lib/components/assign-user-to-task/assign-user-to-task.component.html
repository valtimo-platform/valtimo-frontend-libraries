<ng-container
  *ngIf="{
    candidateUsers: candidateUsersForTask$ | async,
    disabled: disabled$ | async,
    idOnServer: assignedIdOnServer$ | async,
    mouseIsOverAssignee: mouseIsOverAssignee$ | async,
    assignedUserFullName: assignedUserFullName$ | async,
    selectedUserId: selectedUserId$ | async,
  } as obs"
>
  <div
    class="assign-user-container"
    *ngIf="{hasSelection: userIdToAssign === obs.idOnServer && obs.idOnServer !== null} as vars"
    (mouseenter)="onMouseEnterAssignee()"
    (mouseleave)="onMouseLeaveAssignee()"
  >
    <div
      class="assignee-text element"
      [ngClass]="{active: vars.hasSelection && !obs.mouseIsOverAssignee}"
    >
      <span class="bold">{{ ('assignTask.assignedTaskText' | translate) + ' ' }}</span>

      &nbsp;

      {{ obs.assignedUserFullName }}
    </div>

    <button
      cdsButton="ghost"
      class="element"
      [ngClass]="{active: vars.hasSelection && obs.mouseIsOverAssignee}"
      [disabled]="obs.disabled"
      size="sm"
      (click)="unassignTask()"
    >
      {{ 'assignTask.removeButtonText' | translate }}
    </button>

    <cds-toggletip
      align="bottom"
      class="element main"
      [autoAlign]="true"
      [isOpen]="open$ | async"
      [ngClass]="{active: !vars.hasSelection}"
    >
      <button cdsToggletipButton cdsButton="tertiary" size="sm" class="set-assignee-button">
        {{ 'assignTask.buttonText' | translate }}

        <svg class="cds--btn__icon" cdsIcon="user--follow" size="16"></svg>
      </button>

      <div cdsToggletipContent data-carbon-theme="g90" class="assign-task-popover-content">
        <cds-combo-box
          [label]="'processLinkConfiguration.process' | translate"
          [placeholder]="'processLinkConfiguration.selectProcess' | translate"
          [appendInline]="true"
          [dropUp]="false"
          [cdsLayer]="1"
          [items]="obs?.candidateUsers || []"
          [disabled]="obs.disabled"
          (selected)="onUserSelect($event)"
          (clear)="onUserClear()"
        >
          <cds-dropdown-list onclick="event.stopPropagation()"></cds-dropdown-list>
        </cds-combo-box>

        <button
          cdsButton
          class="submit-task-button"
          [disabled]="!obs.selectedUserId || obs.disabled"
          (click)="onSubmitButtonClick()"
        >
          {{ 'assignTask.submitButtonText' | translate }}

          <svg class="cds--btn__icon" cdsIcon="user--follow" size="16"></svg>
        </button>
      </div>
    </cds-toggletip>
  </div>
