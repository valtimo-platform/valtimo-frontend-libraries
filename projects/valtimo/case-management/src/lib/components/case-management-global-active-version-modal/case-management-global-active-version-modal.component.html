<cds-modal valtimoCdsModal size="xs" [open]="open" (close)="onCloseModal()">
  <cds-modal-header [showCloseButton]="true" (closeSelect)="onCloseModal()">
    <h3 cdsModalHeaderHeading>{{ 'caseManagement.globalActiveVersionModal.title' | translate }}</h3>
  </cds-modal-header>

  <section cdsModalContent>
    <p>{{ 'caseManagement.globalActiveVersionModal.description' | translate }}</p>

    <div>
      <cds-notification
        [notificationObj]="{
          type: 'warning',
          title: 'caseManagement.globalActiveVersionModal.warningTitle' | translate,
          message: 'caseManagement.globalActiveVersionModal.warningMessage' | translate,
          showClose: false,
        }"
      >
      </cds-notification>
    </div>
  </section>

  <cds-modal-footer class="valtimo-add-tab-modal__footer">
    <button cdsButton="ghost" (click)="onCloseModal()">
      {{ 'caseManagement.globalActiveVersionModal.cancel' | translate }}
    </button>

    <button cdsButton="primary">
      {{ 'caseManagement.globalActiveVersionModal.continue' | translate }}
    </button>
  </cds-modal-footer>
</cds-modal>
